<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Baytush Sharaf Rover Scout Group</title>
    <style>
        :root {
            --card-bg: #fafaf9;
            --text: #1f1c19;
            --muted: #7b7267;
            --input-bg: #f0efee;
            --input-border: #e2e0dd;
            --accent: #e8912b;
            --btn-bg: linear-gradient(180deg, #f7b25a 0%, #e8912b 100%);
            --btn-hover: linear-gradient(180deg, #f9bc6f 0%, #d9821c 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { min-height: 100%; }
        body { background: #000; overflow-x: hidden; }

        /* ===== দৃশ্য (Scene) ===== */
        .scene {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            gap: clamp(44px, 9vw, 110px);
            padding: 24px;
            position: relative;
        }

        /* ছেলেটি */
        .boy {
            width: 68px; height: 98px; flex: none;
            transform: translateX(-70vw);
            transition: transform 1.6s cubic-bezier(.3,.6,.4,1);
            position: relative; z-index: 3;
        }
        .scene.arrived .boy { transform: translateX(0); }
        .boy svg { width: 100%; height: 100%; overflow: visible; }
        .boy .leg, .boy .arm { transform-box: fill-box; transform-origin: 50% 0; }
        .scene.walking .leg.a { animation: swing .5s ease-in-out infinite alternate; }
        .scene.walking .leg.b { animation: swing .5s ease-in-out infinite alternate-reverse; }
        .scene.walking .arm { animation: swing .5s ease-in-out infinite alternate; }
        .scene.walking .boy svg { animation: bob .25s ease-in-out infinite alternate; }
        @keyframes swing { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }

        /* আলোর রেখা ও গ্লো */
        .beam, .glow { position: fixed; pointer-events: none; opacity: 0; transition: opacity .6s ease; z-index: 1; }
        .beam { transform-origin: 0 50%; filter: blur(7px); }
        .beam::before {
            content: ''; position: absolute; inset: 0;
            clip-path: polygon(0 47%, 100% 4%, 100% 96%, 0 53%);
            background: linear-gradient(90deg, rgba(255,244,215,.7), rgba(255,244,215,.16));
        }
        .glow {
            width: 380px; height: 380px; margin: -190px 0 0 -190px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,246,225,.55) 0%, rgba(255,246,225,.18) 40%, transparent 68%);
            transition: opacity 1.2s ease;
        }
        .scene.lit .beam, .scene.lit .glow { animation: flick 1.5s forwards; }
        @keyframes flick {
            0% { opacity: 0; } 10% { opacity: .9; } 16% { opacity: .1; } 28% { opacity: .8; }
            36% { opacity: .25; } 52% { opacity: 1; } 100% { opacity: 1; }
        }
        @keyframes litUp {
            0% { filter: brightness(.02); } 10% { filter: brightness(.5); } 16% { filter: brightness(.05); }
            28% { filter: brightness(.7); } 36% { filter: brightness(.15); } 55% { filter: brightness(.9); }
            100% { filter: brightness(1); }
        }
        .dust { position: fixed; pointer-events: none; z-index: 1; transform-origin: 0 50%; opacity: 0; transition: opacity 1s ease .8s; }
        .scene.lit .dust { opacity: 1; }
        .dust span { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: 0; animation: drift 3.5s ease-in-out infinite; }
        @keyframes drift { 0% { opacity: 0; transform: translate(0,0); } 50% { opacity: .8; } 100% { opacity: 0; transform: translate(8px,-10px); } }

        /* কার্ড: শুরুতে অন্ধকার, টর্চের আলোয় উজ্জ্বল */
        .login-box {
            position: relative; z-index: 2;
            background: var(--card-bg);
            width: 100%; max-width: 236px;
            border-radius: 11px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
            overflow: hidden;
            filter: brightness(.02);
        }
        .scene.lit .login-box { filter: brightness(1); animation: litUp 1.5s forwards, pop 1s cubic-bezier(.2,.9,.3,1.2) both; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 50px rgba(255,225,170,.14); }
        .scene.lit .login-box.shake { animation: shake .45s; }
        @keyframes pop { from { transform: translateY(10px) scale(.94); } to { transform: none; } }
        /* ফর্মের অংশগুলো একে একে উঠে আসে */
        .scene.lit .rv { animation: rise .6s cubic-bezier(.2,.8,.3,1) both; animation-delay: var(--d, 0s); }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        /* বাটনে আলোর ঝিলিক */
        .btn-login::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
            transform: skewX(-20deg); animation: shine 3.6s ease-in-out 2.4s infinite; pointer-events: none;
        }
        @keyframes shine { 0% { left: -60%; } 35%, 100% { left: 140%; } }
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.55); transform: scale(0); animation: rip .55s ease-out forwards; pointer-events: none; }
        @keyframes rip { to { transform: scale(1); opacity: 0; } }
        /* বিম ও গ্লো শ্বাস নেয় */
        .scene.lit .beam::before { animation: breathe 3s ease-in-out 1.6s infinite alternate; }
        @keyframes breathe { from { opacity: .82; } to { opacity: 1; } }
        .scene.lit .glow { animation: flick 1.5s forwards, pulse 4s ease-in-out 1.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        /* ছেলে দাঁড়িয়ে নিঃশ্বাস নেয় ও চোখ পিটপিট করে */
        .scene.lit .boy svg { animation: idle 2.6s ease-in-out infinite alternate; }
        @keyframes idle { from { transform: translateY(0); } to { transform: translateY(-2px); } }
        .boy .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
        @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
        /* সফল লগইনে আলোর ঝলকানি */
        .flash { position: fixed; inset: 0; background: #fff8e6; opacity: 0; pointer-events: none; z-index: 9; }
        .flash.go { animation: flashGo .7s ease-in forwards; }
        @keyframes flashGo { 0% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 1; } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

        .login-header { background: transparent; color: var(--text); text-align: center; padding: 13px 14px 1px; }
        .login-header img {
            width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
            margin-bottom: 5px; box-shadow: 0 0 0 3px var(--accent);
        }
        .login-header h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 12.5px; margin-bottom: 1px; }
        .login-header p { font-size: 9.5px; color: var(--muted); }

        .login-body { padding: 9px 15px 11px; }
        .form-group { margin-bottom: 7px; }
        label { display: block; margin-bottom: 3px; font-weight: 600; font-size: 10px; color: #555; }
        .input-wrap { position: relative; }
        .ico { width: 11px; height: 11px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .input-wrap > .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #a09a92; pointer-events: none; }
        .input-wrap:focus-within > .ico { color: var(--accent); }
        .spin { animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 5px 8px 5px 26px;
            background: var(--input-bg); color: var(--text);
            border: 1px solid var(--input-border); border-radius: 5px; font-size: 11px;
        }
        input[type="password"] { padding-right: 28px; }
        .toggle-eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #a09a92; cursor: pointer; padding: 5px 6px; display: flex; }
        .toggle-eye:hover { color: var(--accent); }
        .btn-login:disabled { opacity: .75; cursor: wait; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,145,43,.2); }

        .btn-login {
            width: 100%; padding: 6px; border: none; border-radius: 5px; position: relative; overflow: hidden;
            background: var(--btn-bg); color: #fff;
            font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:hover { background: var(--btn-hover); }

        .error-msg {
            background: #fdecea; color: #c0392b; font-size: 10px;
            padding: 5px 8px; border-radius: 5px; margin-bottom: 8px; display: none;
        }
        .error-msg.show { display: block; }

        .back-home { text-align: center; margin-top: 9px; font-size: 9.5px; }
        .back-home a { display: inline-flex; align-items: center; gap: 5px; }
        .back-home a { color: var(--accent); text-decoration: none; }
        .back-home a:hover { text-decoration: underline; }

        @media (max-width: 720px) {
            .scene { flex-direction: column; gap: 50px; justify-content: flex-start; padding-top: 30px; }
            .boy { align-self: flex-start; width: 58px; height: 84px; transform: translateX(-100vw); }
        }
        @media (prefers-reduced-motion: reduce) {
            .boy, .login-box, .beam, .glow { transition: none; }
            .scene.lit .beam, .scene.lit .beam::before, .scene.lit .glow, .scene.lit .login-box, .scene.lit .rv, .scene.lit .boy svg, .boy .eye, .btn-login::after, .dust span { animation: none; }
            .scene.lit .beam, .scene.lit .glow { opacity: 1; }
            .scene.lit .login-box { filter: none; }
            .scene.walking .leg, .scene.walking .boy svg { animation: none; }
        }
    </style>
</head>
<body>

    <div class="flash" id="flash"></div>
    <div class="scene" id="scene">
        <div class="beam" id="beam"></div>
        <div class="dust" id="dust"></div>
        <div class="glow" id="glow"></div>

        <!-- টর্চ হাতে ছেলে -->
        <div class="boy" id="boy">
            <svg viewBox="0 0 90 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- পেছনের পা -->
                <g class="leg b">
                    <rect x="36" y="82" width="9" height="34" rx="4" fill="#e0a67a"/>
                    <rect x="35" y="80" width="11" height="17" rx="4" fill="#3b5ea8"/>
                    <ellipse cx="42" cy="118" rx="8" ry="4" fill="#d9534f"/>
                </g>
                <!-- সামনের পা -->
                <g class="leg a">
                    <rect x="44" y="82" width="9" height="34" rx="4" fill="#e0a67a"/>
                    <rect x="43" y="80" width="11" height="17" rx="4" fill="#4a6fc0"/>
                    <ellipse cx="51" cy="118" rx="8" ry="4" fill="#e2635e"/>
                </g>
                <!-- পেছনের হাত -->
                <g class="arm"><rect x="34" y="52" width="9" height="24" rx="4.5" fill="#6aa036"/><circle cx="38.5" cy="77" r="4" fill="#e0a67a"/></g>
                <!-- শরীর -->
                <rect x="31" y="48" width="26" height="38" rx="9" fill="#7cb342"/>
                <!-- হাত + টর্চ -->
                <rect x="50" y="52" width="14" height="10" rx="5" fill="#7cb342"/>
                <rect x="60" y="54" width="14" height="6" rx="3" fill="#e0a67a"/>
                <rect x="72" y="50" width="12" height="11" rx="2" fill="#7a7a7a"/>
                <ellipse cx="84" cy="55.5" rx="2" ry="5.5" fill="#fff6cf"/>
                <!-- মাথা -->
                <circle cx="44" cy="32" r="15" fill="#e0a67a"/>
                <path d="M29 30 C29 15 42 11 52 16 C57 19 59 24 58 29 C52 22 40 22 29 30Z" fill="#2b2018"/>
                <circle class="eye" cx="51" cy="33" r="1.8" fill="#2b2018"/>
                <path d="M49 40 Q52 42 55 40" stroke="#8a4f2e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- লগইন কার্ড -->
        <div class="login-box" id="card">
            <div class="login-header rv" style="--d:.5s">
                <img src="logo.jpg.jpg" alt="Logo" onerror="this.style.display='none'">
                <h1>Admin Panel Login</h1>
                <p>Baytush Sharaf Rover Scout Group</p>
            </div>
            <div class="login-body">
                <div class="error-msg" id="errorMsg">Incorrect username or password.</div>
                <form id="loginForm">
                    <div class="form-group rv" style="--d:.75s">
                        <label>Username</label>
                        <div class="input-wrap">
                            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                            <input type="text" id="username" autocomplete="username" required>
                        </div>
                    </div>
                    <div class="form-group rv" style="--d:.95s">
                        <label>Password</label>
                        <div class="input-wrap">
                            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                            <input type="password" id="password" autocomplete="current-password" required>
                            <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show password"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                    </div>
                    <button type="submit" class="btn-login rv" style="--d:1.15s" id="loginBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg> Login</button>
                </form>
                <div class="back-home rv" style="--d:1.3s"><a href="index.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to live site</a></div>
            </div>
        </div>
    </div>

    <script>
        // ===== অ্যানিমেশন: ছেলে হেঁটে আসে → টর্চ জ্বালায় → কার্ড আলোয় ভরে ওঠে =====
        const scene = document.getElementById('scene');
        const boy = document.getElementById('boy');
        const card = document.getElementById('card');
        const beam = document.getElementById('beam');
        const glow = document.getElementById('glow');
        const dust = document.getElementById('dust');

        function aim() {
            const b = boy.getBoundingClientRect();
            const c = card.getBoundingClientRect();
            const tx = b.left + b.width * (84 / 90);       // টর্চের মুখ
            const ty = b.top + b.height * (55.5 / 130);
            const cx = c.left + c.width / 2;
            const cy = c.top + c.height / 2;
            const dx = cx - tx, dy = cy - ty, dist = Math.hypot(dx, dy);
            const ux = dx / dist, uy = dy / dist;
            // কার্ডের কিনারা পর্যন্ত রেখা, প্রস্থ = কার্ডের পাশের মাপ
            const tEdge = Math.min((c.width / 2) / (Math.abs(ux) || 1e-6), (c.height / 2) / (Math.abs(uy) || 1e-6));
            const len = Math.max(dist - tEdge, 40);
            const ext = Math.abs(uy) * c.width + Math.abs(ux) * c.height;
            const h = ext * 0.95;
            const ang = Math.atan2(dy, dx) * 180 / Math.PI;
            beam.style.cssText = `left:${tx}px;top:${ty - h / 2}px;width:${len}px;height:${h}px;transform:rotate(${ang}deg)`;
            dust.style.cssText = beam.style.cssText;
            if (!dust.children.length) {
                for (let i = 0; i < 16; i++) {
                    const sp = document.createElement('span');
                    sp.style.left = (5 + Math.random() * 90) + '%';
                    sp.style.top = (20 + Math.random() * 60) + '%';
                    sp.style.animationDelay = (Math.random() * 3.5) + 's';
                    dust.appendChild(sp);
                }
            }
            glow.style.left = cx + 'px';
            glow.style.top = cy + 'px';
        }

        let done = false;
        function torchOn() {
            if (done) return; done = true;
            scene.classList.remove('walking');
            aim();
            scene.classList.add('lit');
            setTimeout(() => { if (!/Mobi|Android/i.test(navigator.userAgent)) document.getElementById('username').focus(); }, 1600);
        }

        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.addEventListener('resize', () => { if (done) aim(); });
        window.addEventListener('load', () => {
            if (reduce) { scene.classList.add('arrived'); torchOn(); return; }
            scene.classList.add('walking');
            requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('arrived')));
            boy.addEventListener('transitionend', torchOn, { once: true });
            setTimeout(torchOn, 2000);   // নিরাপত্তার জন্য ফলব্যাক
        });

        // ===== পাসওয়ার্ড দেখা/লুকানো =====
        const ICON_EYE = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
        const ICON_EYE_OFF = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 12 19C6 19 2 12 2 12a18 18 0 0 1 4.1-5M9.9 5.2A9 9 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-2.2 3.2M3 3l18 18"/></svg>';
        document.getElementById('toggleEye').addEventListener('click', function () {
            const pw = document.getElementById('password');
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            this.innerHTML = show ? ICON_EYE_OFF : ICON_EYE;
        });

        // ===== বাটনে ঢেউ (ripple) =====
        document.getElementById('loginBtn').addEventListener('pointerdown', function (e) {
            const r = this.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
            const sp = document.createElement('span');
            sp.className = 'ripple';
            sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
            this.appendChild(sp);
            setTimeout(() => sp.remove(), 600);
        });

        // ===== লগইন লজিক (আগের মতোই) =====
        const DEFAULT_USER = 'admin';
        const DEFAULT_PASS = 'scout1234';

        if (!localStorage.getItem('adminUser')) {
            localStorage.setItem('adminUser', DEFAULT_USER);
            localStorage.setItem('adminPass', DEFAULT_PASS);
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const savedUser = localStorage.getItem('adminUser');
            const savedPass = localStorage.getItem('adminPass');

            if (u === savedUser && p === savedPass) {
                localStorage.setItem('adminLoggedIn', 'true');
                const btn = document.getElementById('loginBtn');
                btn.disabled = true;
                btn.innerHTML = '<svg class="ico spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg> Logging in...';
                document.getElementById('flash').classList.add('go');
                setTimeout(() => { window.location.href = 'admin.html'; }, 650);
            } else {
                const err = document.getElementById('errorMsg');
                err.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
            }
        });
    </script>
</body>
</html>
